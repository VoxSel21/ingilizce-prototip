<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pati · Özelleştirme taslakları</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#14121e;color:#f9f4ff;font:15px system-ui,sans-serif;display:grid;place-items:center;min-height:100dvh;padding:24px 12px 95px}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,input:focus-visible{outline:3px solid #ffda65;outline-offset:3px}.phone{width:min(100%,420px);min-height:735px;background:#252039;border-radius:32px;overflow:hidden;box-shadow:0 24px 70px #0006}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 24px}.pill{background:#38304e;border-radius:30px;padding:8px 13px;font-size:12px}.lead{padding:0 24px}.lead h1{font-size:29px;letter-spacing:-1px;margin:8px 0}.muted{color:#bdb3d1;font-size:13px;line-height:1.5}.scene{background:#ccebed url('resim/bg_cayir.jpg') center/cover;border-radius:24px;display:grid;place-items:center;position:relative;overflow:hidden}.scene canvas{width:210px;height:210px;object-fit:contain}.name{position:absolute;top:14px;left:14px;color:#2c2540;background:#fffc;padding:5px 11px;border-radius:16px;font-weight:700}.editor{padding:24px}.editor h2{font-size:17px;margin:0 0 12px}.colors{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.swatch{height:42px;border-radius:50%;border:3px solid transparent;background:var(--c);position:relative}.swatch.active{outline:3px solid #c3b2ff;outline-offset:2px}.swatch.owned:after{content:'✓';display:grid;place-items:center;position:absolute;bottom:-4px;right:-3px;width:17px;height:17px;border-radius:50%;font-size:11px;background:#1b6657;color:white}.advanced{margin-top:20px;background:#1b1828;padding:14px;border-radius:16px}.advanced label{display:flex;justify-content:space-between;align-items:center;font-size:13px}.advanced input[type=color]{width:52px;height:32px;border:0;background:transparent}.advanced input[type=range]{width:100%;accent-color:#b5a0ff}.save{display:flex;gap:12px;align-items:center;margin-top:22px}.save button{background:#bca6ff;color:#231d32;flex:1;min-height:48px;border-radius:16px;font-weight:800}.save .reset{white-space:nowrap;flex:none;background:#3b334e;color:#eee;padding:0 15px}.foot{padding:0 24px 24px}.price{display:flex;justify-content:space-between;padding:12px 0;font-size:13px}.nav{position:fixed;bottom:18px;display:flex;gap:15px;align-items:center;background:#fff;color:#201b31;padding:8px;border-radius:60px;box-shadow:0 6px 30px #0006;z-index:5}.nav button{color:white;width:40px;height:40px;border-radius:50%;background:#282238;font-size:20px}.nav div{text-align:center;min-width:180px}.nav small{display:block;font-size:10px;color:#635870}.prototype{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#c6b6e7}.status{min-height:20px;font-size:12px;color:#c6ead7}.A .scene{margin:20px 24px 0;height:215px}.A .editor{background:#302942;margin-top:18px;border-radius:28px 28px 0 0}.B{background:#e9e2d7;color:#322b39}.B .top{color:#322b39}.B .pill{background:#fff9}.B .prototype,.B .muted{color:#6e6279}.B .lead h1{font-family:Georgia,serif;font-weight:500;font-size:36px}.B .scene{margin:18px 24px;height:285px;background-color:#f8f2e8;background-image:none;border:1px solid #b3a693}.B .scene:before{content:'';position:absolute;width:185px;height:185px;border:1px dashed #b8a99d;border-radius:50%}.B .scene canvas{z-index:1}.B .editor{padding-top:0}.B .colors{display:flex;overflow:auto;padding:5px;gap:10px}.B .swatch{min-width:44px}.B .advanced{background:#fff9}.B .foot{background:#ddd4c8;padding-top:8px}.B .save button{background:#415f50;color:#fff}.B .status{color:#375d4b}.C .lead{display:none}.C .scene{height:235px;border-radius:0;background-image:linear-gradient(180deg,#c4dcff33,#a995d233),url('resim/bg_gece.jpg')}.C .scene canvas{width:230px;height:230px}.C .editor{padding-top:20px}.C .colors{grid-template-columns:repeat(3,1fr);gap:10px}.C .swatch{height:70px;border-radius:16px;text-align:left;padding:8px;display:flex;align-items:end;justify-content:space-between}.C .swatch span{font-size:10px;background:#221c34d9;padding:4px 6px;border-radius:6px;color:white}.C .swatch.owned:after{top:5px;right:5px;bottom:auto}.C .advanced{margin-top:14px}.C .foot{background:#302942;padding-top:4px}.tabline{display:flex;gap:8px;margin:10px 0 18px}.tabline span{font-size:12px;padding:7px 10px;border-radius:14px;background:#3c3354}.tabline span:first-child{background:#c0adf4;color:#251f34}.A .tabline,.B .tabline{display:none}@media(max-width:440px){body{padding:0 0 90px}.phone{border-radius:0;min-height:100dvh}.nav{bottom:12px}}
</style><main class="phone" id="phone"><header class="top"><b>🐱 Pati’nin stüdyosu</b><span class="pill" id="wallet"></span></header><div class="lead"><span class="prototype">Tasarım taslağı · kayıt yapılmaz</span><h1 id="heading"></h1><p class="muted" id="intro"></p></div><div class="scene"><span class="name">Pati</span><canvas id="cat" width="400" height="400" role="img" aria-label="Klasik Pati, seçilen kürk renginin önizlemesi"></canvas></div><section class="editor"><div class="tabline"><span>Kürk rengi</span><span>Aksesuarlar</span><span>Arka plan</span></div><h2 id="editorTitle"></h2><div class="colors" id="colors"></div><div class="advanced"><label>Rengini kendin oluştur <input id="custom" type="color" value="#fdbe86" aria-label="Özel renk"></label><p class="muted">Seçili renk: <b id="hex"></b></p><label>Ton <input id="tone" type="range" min="0" max="359" value="25" aria-label="Kürk rengi tonu"></label></div></section><footer class="foot"><div class="price"><span id="owned"></span><b id="price"></b></div><div class="save"><button class="reset" id="reset">↶ Sıfırla</button><button id="save"></button></div><p class="status" id="status" aria-live="polite"></p><p class="muted">Her yeni renk 10 altın. Alınan renk tekrar ücret istemez. Bu örnekte seçimler ve bakiye yalnız bellekte tutulur.</p></footer></main><div class="nav"><button id="prev" aria-label="Önceki tasarım">←</button><div><b id="design"></b><small>TASLAK · ← → ile değiştir</small></div><button id="next" aria-label="Sonraki tasarım">→</button></div>
<script src="js/kedi-cizim.js?v=0.10.0"></script>
<script>
const designs=[['A','Kompakt palet','Pati’ye biraz renk kat.','Önizleme üstte, renkler ve düzenleme tek çekmecede.','Bir renk seç'],['B','Atölye','Küçük bir değişiklik.','Büyük ayna, sakin bir çalışma alanı ve yatay renk şeridi.','Renk koleksiyonu'],['C','Koleksiyon','Kendi Pati’n.','Sahip olduklarını ve yeni renkleri kartlardan seç.','Kürk koleksiyonu']];
const palette=[['#FDBE86','Turuncu'],['#F1DDBF','Krem'],['#A9AAB8','Gri'],['#4A4458','Gece'],['#81C7D4','Mavi'],['#EF8D83','Mercan'],['#69B8BA','Deniz'],['#9681BD','Lavanta'],['#F4A7B9','Pembe'],['#9CCC65','Yeşil'],['#FFD54F','Sarı'],['#D9A066','Bal']];
const sourceImage=new Image();sourceImage.onload=()=>render();sourceImage.src='resim/kedi_pofuduk.png';
let index=Math.max(0,designs.findIndex(x=>x[0]===(new URLSearchParams(location.search).get('tasarim')||'A'))),hex='#FDBE86',gold=20;const owned=new Set(['#FDBE86','#A9AAB8']);const $=id=>document.getElementById(id);
function render(){const [letter,name,title,intro,ed]=designs[index];if(letter==='A'){location.replace('ozellestirme-A-prototip.html');return;}$('phone').className='phone '+letter;$('heading').textContent=title;$('intro').textContent=intro;$('editorTitle').textContent=ed;$('design').textContent=letter+' · '+name;$('wallet').textContent='🪙 '+gold;$('hex').textContent=hex;$('colors').replaceChildren();for(const [c,n]of palette){const b=document.createElement('button');b.className='swatch'+(c===hex?' active':'')+(owned.has(c)?' owned':'');b.style.setProperty('--c',c);b.setAttribute('aria-label',n+(owned.has(c)?' · sende':' · 10 altın'));b.setAttribute('aria-pressed',c===hex);if(letter==='C'){const label=document.createElement('span');label.textContent=n;b.append(label);}b.onclick=()=>{hex=c;$('custom').value=c;render();};$('colors').append(b);}$('owned').textContent=owned.has(hex)?'✓ Koleksiyonunda':'Yeni renk';$('price').textContent=owned.has(hex)?'Ücretsiz kullan':'10 🪙';$('save').textContent=owned.has(hex)?'Bu rengi kullan':'10 🪙 · Al ve kullan';$('save').disabled=!owned.has(hex)&&gold<10;if(sourceImage.complete&&sourceImage.naturalWidth){const c=$('cat').getContext('2d');c.clearRect(0,0,400,400);c.drawImage(sourceImage,0,0);try{const px=c.getImageData(0,0,400,400);kurkBoya(px.data,hex);c.putImageData(px,0,0);}catch(e){}}history.replaceState(null,'','?tasarim='+letter);}
$('custom').oninput=e=>{hex=e.target.value.toUpperCase();render();};$('tone').oninput=()=>{const [,s,l]=rgbHsl(...hexRgb(hex));hex=rgbHex(...hslRgb(+$('tone').value,s,l));$('custom').value=hex;render();};$('save').onclick=()=>{if(!owned.has(hex)){if(gold<10)return;gold-=10;owned.add(hex);}$('status').textContent='Taslakta uygulandı. Gerçek kaydın ve altının değişmedi.';render();};$('reset').onclick=()=>{hex='#FDBE86';$('tone').value=25;render();};function move(n){index=(index+n+3)%3;render();}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);document.onkeydown=e=>{if(e.target.closest('input,textarea,select'))return;if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);};render();
</script></html>
